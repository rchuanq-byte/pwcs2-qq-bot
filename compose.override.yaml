# Docker Compose loads this file automatically with compose.yaml.
# AstrBot is the default gateway; the old data/config mount remains for rollback.
services:
  data-init:
    image: ${PWCS2_ASTRBOT_IMAGE:-pwcs2-astrbot:20261026}
    build:
      context: .
      dockerfile: deploy/Dockerfile.astrbot
      target: astrbot-runtime
    user: "0:0"
    entrypoint: ["sh", "-c"]
    environment:
      HIGHLIGHT_SHARED_GID: "${PWCS2_HIGHLIGHT_SHARED_OUTPUT_GID:-1000}"
    command:
      - >-
        mkdir -p /data/nanobot /AstrBot/data/home &&
        chown 10001:10001 /AstrBot/data /AstrBot/data/home &&
        chown -R 10001:10001 /data &&
        for path in /data/highlights /data/demos /data/demo-import; do
          if [ -d "$${path}" ]; then
            chown 10001:"$${HIGHLIGHT_SHARED_GID}" "$${path}" &&
            chmod 0770 "$${path}";
          fi;
        done &&
        if [ -d /data/highlights/renders ]; then
          chown 10001:"$${HIGHLIGHT_SHARED_GID}" /data/highlights/renders &&
          chmod 0750 /data/highlights/renders;
        fi
    volumes:
      - ./data/bot:/data
      - ./data/astrbot:/AstrBot/data
    restart: "no"

  bot:
    image: ${PWCS2_ASTRBOT_IMAGE:-pwcs2-astrbot:20261026}
    build:
      dockerfile: deploy/Dockerfile.astrbot
      target: astrbot-runtime
    command: ["python", "/opt/niuniu/astrbot_bootstrap.py"]
    user: "10001:10001"
    environment:
      NIUNIU_BUSINESS_CONFIG: /config/config.json
      NIUNIU_STAGE: "0"
      TZ: Asia/Shanghai
    volumes:
      - ./config/config.json:/data/config.json:ro
      - ./data/astrbot:/AstrBot/data
    ports:
      - "127.0.0.1:6185:6185"
    depends_on:
      data-init:
        condition: service_completed_successfully
      napcat:
        condition: service_started
