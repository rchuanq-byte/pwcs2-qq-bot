# Optional CI template: copy to .github/workflows/ to opt in.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,legacy]" pillow tzdata
      - run: ruff check .
      - run: pytest -q
      - run: bash -n deploy/*.sh tests/test_iwan_watchdog.sh
      - run: bash tests/test_iwan_watchdog.sh
